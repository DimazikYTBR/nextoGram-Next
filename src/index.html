<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<title>NextoGram</title>
<style>
  :root {
    --bg: #0e1621; --panel: #17212b; --line: #0b121a; --text: #e8eef4;
    --muted: #7f91a4; --accent: #5aa7e8; --out: #2b5278; --in: #182533;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.4 "Segoe UI", system-ui, sans-serif; }
  button, input { font: inherit; }

  /* экран входа */
  #login { height: 100%; display: flex; align-items: center; justify-content: center; }
  .card { width: 340px; padding: 28px; background: var(--panel); border-radius: 14px; }
  .card h1 { margin: 0 0 4px; font-size: 22px; }
  .card p { margin: 0 0 18px; color: var(--muted); }
  .card input { width: 100%; padding: 11px 12px; margin-bottom: 10px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--bg); color: var(--text); outline: none; }
  .card input:focus { border-color: var(--accent); }
  .card button { width: 100%; padding: 11px; border: 0; border-radius: 8px;
    background: var(--accent); color: #fff; font-weight: 600; cursor: pointer; }
  #err { color: #ff7b7b; margin-top: 10px; min-height: 18px; font-size: 13px; }
  .hint { color: var(--muted); font-size: 12px; margin-top: 12px; }

  /* основное окно */
  #app { display: none; height: 100%; }
  #side { width: 320px; background: var(--panel); border-right: 1px solid var(--line);
    display: flex; flex-direction: column; }
  #side header { padding: 14px 16px; font-weight: 700; font-size: 16px;
    display: flex; justify-content: space-between; align-items: center; }
  #side header button { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 12px; }
  #chats { flex: 1; overflow-y: auto; }
  .chat { padding: 10px 16px; cursor: pointer; border-bottom: 1px solid var(--line); }
  .chat:hover { background: #1c2a38; }
  .chat.active { background: #2b5278; }
  .chat .row { display: flex; justify-content: space-between; gap: 8px; }
  .chat .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chat .l { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .badge { background: var(--accent); color: #fff; border-radius: 10px; padding: 0 7px; font-size: 12px; }

  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #app { display: none; }
  #app.on { display: flex; }
  #head { padding: 14px 18px; background: var(--panel); border-bottom: 1px solid var(--line); font-weight: 600; }
  #msgs { flex: 1; overflow-y: auto; padding: 16px 18px; display: flex; flex-direction: column; gap: 6px; }
  .m { max-width: 70%; padding: 8px 12px; border-radius: 12px; background: var(--in);
    white-space: pre-wrap; word-wrap: break-word; align-self: flex-start; }
  .m.out { background: var(--out); align-self: flex-end; }
  .m small { display: block; color: var(--muted); font-size: 11px; text-align: right; margin-top: 2px; }
  #empty { margin: auto; color: var(--muted); }
  #form { display: none; padding: 10px 14px; background: var(--panel); border-top: 1px solid var(--line); gap: 8px; }
  #form input { flex: 1; padding: 10px 12px; border-radius: 20px; border: 0; background: var(--bg);
    color: var(--text); outline: none; }
  #form button { border: 0; border-radius: 20px; padding: 0 18px; background: var(--accent);
    color: #fff; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>

<div id="login">
  <div class="card">
    <h1>NextoGram</h1>
    <p id="step-title">Загрузка…</p>
    <div id="fields"></div>
    <div id="err"></div>
    <div class="hint" id="hint"></div>
  </div>
</div>

<div id="app">
  <div id="side">
    <header>NextoGram <button id="logout">Выйти</button></header>
    <div id="chats"></div>
  </div>
  <div id="main">
    <div id="head">Выбери чат</div>
    <div id="msgs"><div id="empty">Выбери чат слева</div></div>
    <form id="form"><input id="text" placeholder="Сообщение…" autocomplete="off"><button>Отправить</button></form>
  </div>
</div>

<script src="renderer.js"></script>
</body>
</html>
